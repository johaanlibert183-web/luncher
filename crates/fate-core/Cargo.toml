[package]
name = "fate-core"
description = "Launcher core for Fate Launcher: Java/Forge detection, modpack manifests, launch arguments, process control."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
